name: Checks

# PRs cannot access Athena, so tests stub the data readers.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the R version pinned in renv.lock
        id: r-version
        run: echo "version=$(jq -r '.R.Version' renv.lock)" >> "$GITHUB_OUTPUT"

      - name: Set up R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          r-version: ${{ steps.r-version.outputs.version }}
          use-public-rspm: true

      - name: Install system libraries
        # Match the publishing render workflow.
        run: |
          sudo apt-get install -y --no-install-recommends \
            libmagick++-dev libfreetype6-dev libfontconfig1-dev \
            libharfbuzz-dev libfribidi-dev libpng-dev libtiff5-dev \
            libjpeg-dev libwebp-dev libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Restore renv
        uses: r-lib/actions/setup-renv@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.9.37"

      - name: Check renv.lock matches the code
        shell: Rscript {0}
        run: |
          if (!renv::status()$synchronized) {
            stop("renv.lock is out of sync with the code; run renv::snapshot()")
          }

      - name: Lint
        shell: Rscript {0}
        run: lintr::lint_dir()
        env:
          LINTR_ERROR_ON_LINT: true

      - name: Unit tests
        shell: Rscript {0}
        run: testthat::test_dir("tests/testthat", stop_on_failure = TRUE)

      - name: Inspect each dashboard
        run: |
          for dir in dashboards/*/; do
            name="$(basename "$dir")"
            echo "::group::${name}"
            (cd "$dir" && quarto inspect "${name}.qmd" > /dev/null)
            echo "::endgroup::"
          done
