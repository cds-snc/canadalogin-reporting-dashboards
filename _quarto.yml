project:
  # Render straight into the sibling publishing repo's staging folder, matching
  # Signal Check. The path is relative to this project root, so it is unaffected
  # by how deep a dashboard sits. Output mirrors the input tree, so a dashboard
  # at dashboards/<name>/<name>.qmd lands at reports/dashboards/<name>/<name>.html.
  # publish.sh is then run there on that path; it keys its stable URL token on the
  # basename alone, so no two dashboards may share an output filename.
  # Assumes the repos sit side by side under one parent directory.
  output-dir: ../canadalogin-signal-check-publishing/reports

  # Every dashboard runs with the project root as its working directory, so
  # source("common/..."), img/, fonts/ and .env resolve identically whatever the
  # depth. Note the asymmetry this creates and do not fight it: paths declared
  # HERE resolve against the project root, while paths declared in a dashboard's
  # own front matter resolve against that dashboard's directory. Shared assets
  # therefore live in this file; per-dashboard render artefacts live in the qmd.
  execute-dir: project

  # Only dashboard documents are render targets. Without this, a project render
  # also picks up every .md sitting in a dashboard's notes/ folder and runs it
  # as a document, code chunks and all - a working note is not a deliverable,
  # and one with an R fence in it will happily open a database connection.
  # It also keeps a bare `quarto render` at the root to dashboards alone.
  render:
    - "dashboards/*/*.qmd"

  # Regenerates _brand.generated.yml, which is what `brand:` below points at.
  # Load-bearing, not a nicety: without it nothing under dashboards/ renders.
  # See common/resolve-brand.R for the Quarto defect it works around.
  pre-render: common/resolve-brand.R

# Everything below is shared by every dashboard. A dashboard overrides what it
# needs in its own front matter; it should not need to restate any of this.
format:
  dashboard:
    orientation: rows
    embed-resources: true
    scrolling: true
    theme: [cosmo, _fonts.scss]   # _fonts.scss: self-hosted brand fonts
    css: styles.css

# Generated by the pre-render step above from _brand.yml, which stays the
# source of brand truth and is the only one to edit. See common/resolve-brand.R.
brand: _brand.generated.yml

execute:
  echo: false
  warning: false
  message: false

knitr:
  opts_chunk:
    # ragg reads brand families out of the systemfonts registry (see
    # register_cds_fonts) and sizes text the same on macOS and Linux.
    dev: ragg_png
    dpi: 200
