name: Checks

# Lint, unit tests and a structural check of each dashboard. No AWS access: the
# Athena role only trusts the publishing repo's main, so the tests stub the readers.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Read the R version pinned in renv.lock
        id: r-version
        run: echo "version=$(jq -r '.R.Version' renv.lock)" >> "$GITHUB_OUTPUT"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.r-version.outputs.version }}
          use-public-rspm: true

      - name: Install system libraries
        # The same list as the render workflow in the publishing repo.
        run: |
          sudo apt-get install -y --no-install-recommends \
            libmagick++-dev libfreetype6-dev libfontconfig1-dev \
            libharfbuzz-dev libfribidi-dev libpng-dev libtiff5-dev \
            libjpeg-dev libwebp-dev libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Restore renv
        uses: r-lib/actions/setup-renv@v2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.37"

      - name: Check renv.lock matches the code
        shell: Rscript {0}
        run: |
          if (!renv::status()$synchronized) {
            stop("renv.lock is out of sync with the code; run renv::snapshot()")
          }

      - name: Lint
        shell: Rscript {0}
        run: lintr::lint_dir()
        env:
          LINTR_ERROR_ON_LINT: true

      - name: Unit tests
        shell: Rscript {0}
        run: testthat::test_dir("tests/testthat", stop_on_failure = TRUE)

      - name: Inspect each dashboard
        # Parses the YAML, includes and chunk options without running any code.
        run: |
          for dir in dashboards/*/; do
            name="$(basename "$dir")"
            echo "::group::${name}"
            (cd "$dir" && quarto inspect "${name}.qmd" > /dev/null)
            echo "::endgroup::"
          done
